name: MCP Schema Drift Check
description: Detect breaking changes in MCP server tool schemas
author: Wannavf

inputs:
  config:
    description: Path to sentinel.config.json
    required: false
    default: sentinel.config.json
  lockfile:
    description: Path to sentinel-lock.json
    required: false
    default: sentinel-lock.json
  fail-on:
    description: Minimum severity to fail on (MAJOR, MINOR, PATCH)
    required: false
    default: MAJOR

runs:
  using: composite
  steps:
    - uses: actions/setup-node@v4
      with:
        node-version: '20'
    - run: npx -y @wannavf/mcp-sentinel check --config ${{ inputs.config }} --lockfile ${{ inputs.lockfile }} --fail-on ${{ inputs.fail-on }}
      shell: bash
      env:
        FORCE_COLOR: '1'

branding:
  icon: shield
  color: blue
